name: Complete Sweets Contact Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add sweets to Al-Ahsa contact details
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')
          old_branch = "{label:'مبيعات المنتجات البلاستيكية',key:'plasticAhsa',message:messages.plasticAhsa}\n     ]:["
          new_branch = "{label:'مبيعات المنتجات البلاستيكية',key:'plasticAhsa',message:messages.plasticAhsa},\n       {label:'مبيعات الحلويات والمقرمشات',key:'sweets',message:messages.sweets}\n     ]:["
          if old_branch not in s:
              raise SystemExit('Expected Al-Ahsa branch contact block not found')
          s = s.replace(old_branch, new_branch, 1)
          old_contact = "contactRow('المنتجات البلاستيكية','plasticAhsa',messages.plasticAhsa)\n   ]));"
          new_contact = "contactRow('المنتجات البلاستيكية','plasticAhsa',messages.plasticAhsa),\n     contactRow('الحلويات والمقرمشات','sweets',messages.sweets)\n   ]));"
          if old_contact not in s:
              raise SystemExit('Expected Al-Ahsa contact card block not found')
          s = s.replace(old_contact, new_contact, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/i18n.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js .github/workflows/complete-sweets-contact.yml
          git commit -m "fix(contact): include sweets in Al-Ahsa contact details"
          git rm .github/workflows/complete-sweets-contact.yml
          git commit -m "chore: remove temporary contact completion workflow"
          git push