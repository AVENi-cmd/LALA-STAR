name: Sync Approved Responsive Images

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/*-desktop.webp'
      - 'scripts/sync-approved-images.py'
      - '.github/workflows/sync-approved-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-approved-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync approved images
        run: python scripts/sync-approved-images.py

      - name: Commit responsive variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*-mobile.webp assets/images/*-tablet.webp
          if git diff --cached --quiet; then
            echo "No responsive image changes needed."
            exit 0
          fi
          git commit -m "fix(images): sync approved responsive variants [skip ci]"
          git push
