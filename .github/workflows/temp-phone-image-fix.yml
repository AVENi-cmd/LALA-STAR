name: temp phone image fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply requested fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/wide_high_resolution_supermarket_warehouse_aisle.webp','assets/wide_high_resolution_supermarket_warehouse_aisle.png')
          s=s.replace('href="about:invalid#zCSafez"','href="tel:+966138562508"')
          needle='<a href="tel:+966138562508" dir="ltr">013 856 2508</a>'
          note='<small style="display:block; color:#888; font-size:12px; margin-top:5px;">(للاتصال الهاتفي فقط - لا يوجد واتساب)</small>'
          if needle in s and note not in s:
              s=s.replace(needle, needle+note, 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq 'assets/wide_high_resolution_supermarket_warehouse_aisle.png' index.html
          grep -Fq 'href="tel:+966138562508"' index.html
          grep -Fq '(للاتصال الهاتفي فقط - لا يوجد واتساب)' index.html
          ! grep -Fq 'about:invalid#zCSafez' index.html
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix(content): restore plastic image and clarify phone contact'
          git push origin main
