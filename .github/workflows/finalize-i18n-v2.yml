name: Finalize bilingual i18n

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bind all bilingual HTML elements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          i18n = Path('assets/i18n.js')
          html = index.read_text(encoding='utf-8')
          js = i18n.read_text(encoding='utf-8')

          # Every element that already has data-ar/data-en becomes a first-class i18n node.
          tag_re = re.compile(r'<([A-Za-z][A-Za-z0-9:_-]*)([^>]*data-en=["\']([^"\']+)["\'][^>]*)>')
          def bind_attr(match):
              tag, attrs, english = match.group(1), match.group(2), match.group(3)
              if 'data-i18n=' in attrs:
                  return '<' + tag + attrs + '>'
              return '<' + tag + attrs + ' data-i18n="' + english.replace('"','&quot;') + '">'
          html = tag_re.sub(bind_attr, html)

          # Remaining English section labels that do not use data-en/data-ar yet.
          labels = {
              'OUR BUSINESSES': ('section.businesses','أنشطتنا'),
              'LOCATIONS': ('section.locations','الفروع والمواقع'),
              'MAIN BRANCH': ('branch.main','الفرع الرئيسي'),
              'SINCE 2018': ('branch.since','منذ 2018'),
          }
          whitespace = ' ' + chr(9) + chr(10) + chr(13)
          ws = '[' + re.escape(whitespace) + ']*'
          for english, (key, arabic) in labels.items():
              pattern = re.compile('(<([A-Za-z][A-Za-z0-9:_-]*)([^>]*)>)' + ws + re.escape(english) + ws + '(</[A-Za-z][A-Za-z0-9:_-]*>)')
              def repl(m, key=key, english=english):
                  attrs = m.group(3)
                  if 'data-i18n=' not in attrs:
                      attrs += ' data-i18n="' + key + '"'
                  return '<' + m.group(2) + attrs + '>' + english + m.group(4)
              html = pattern.sub(repl, html)

          ui = '''const uiText={
            ar:{
              'nav.home':'الرئيسية','nav.about':'من نحن','nav.categories':'الأقسام التجارية','nav.branches':'فروعنا','nav.contact':'تواصل معنا','nav.wholesale':'طلب توريد جملة',
              'category.food':'المواد الغذائية بالجملة','category.plastics':'البلاستيك والمنتجات الورقية','category.sweets':'الحلويات والمقرمشات','category.explore':'استعراض الأصناف','category.stats':'أكثر من 5,000 صنف جاهز للتوزيع الفوري',
              'branch.main':'الفرع الرئيسي — الدمام','branch.ahsa':'فرع الأحساء','branch.since':'منذ 2018','division.food':'قسم المواد الغذائية','division.plastics':'قسم البلاستيك والورقيات','division.sweets':'قسم الحلويات',
              'contact.call':'اتصال هاتفي','contact.whatsapp':'محادثة واتساب','contact.hours':'ساعات العمل','contact.days':'السبت – الخميس','section.businesses':'أنشطتنا','section.locations':'الفروع والمواقع',
              'footer.description':'شركة لألأة النجوم لتجارة المواد الغذائية بالجملة','footer.cr':'السجل التجاري','footer.rights':'جميع الحقوق محفوظة © 2026 شركة لألأة النجوم التجارية','footer.tagline':'منصة التوريد المعتمدة لقطاع الأعمال (B2B)'
            },
            en:{
              'nav.home':'Home','nav.about':'About Us','nav.categories':'Categories','nav.branches':'Branches','nav.contact':'Contact Us','nav.wholesale':'Request Quote',
              'category.food':'Wholesale Foodstuffs','category.plastics':'Plastics & Paper Products','category.sweets':'Sweets & Snacks','category.explore':'Explore Products','category.stats':'Over 5,000 Products Ready for Distribution',
              'branch.main':'Main Branch — Dammam','branch.ahsa':'Al-Ahsa Branch','branch.since':'SINCE 2018','division.food':'Foodstuffs Division','division.plastics':'Plastics Division','division.sweets':'Sweets Division',
              'contact.call':'Call Us','contact.whatsapp':'WhatsApp Order','contact.hours':'Working Hours','contact.days':'Saturday – Thursday','section.businesses':'OUR BUSINESSES','section.locations':'LOCATIONS',
              'footer.description':'Trading Company for Wholesale Food Stuffs','footer.cr':'Commercial Register','footer.rights':'All Rights Reserved © 2026 Lala Star Trading Co.','footer.tagline':'Designed for Wholesale Excellence'
            }
          };
          '''
          if 'const uiText={' not in js:
              marker = 'const meta='
              if marker not in js:
                  raise SystemExit('i18n.js insertion marker not found')
              js = js.replace(marker, ui + marker, 1)

          old = "const value=labels[current]?.[key]??(current==='en'?dictionary[key]:reverseDictionary[key]);"
          new = "const bilingual=el.getAttribute(`data-${current}`);const value=bilingual??uiText[current]?.[key]??labels[current]?.[key]??(current==='en'?dictionary[key]:reverseDictionary[key]);"
          if old in js:
              js = js.replace(old, new, 1)
          elif new not in js:
              raise SystemExit('i18n resolver not found')

          index.write_text(html, encoding='utf-8')
          i18n.write_text(js, encoding='utf-8')
          print('Bilingual HTML binding and locale map completed.')
          PY

      - name: Validate
        run: |
          node --check assets/i18n.js
          grep -F '<html lang="ar" dir="rtl">' index.html
          grep -F 'assets/i18n.js' index.html
          grep -F 'data-i18n="nav.about"' index.html
          grep -F 'data-i18n="nav.branches"' index.html
          grep -F 'data-i18n="nav.contact"' index.html
          grep -F 'data-i18n="category.food"' index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/i18n.js
          git commit -m "fix(i18n): complete remaining English text bindings"
          git push
