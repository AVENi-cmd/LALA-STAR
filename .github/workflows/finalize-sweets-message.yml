name: Finalize Sweets WhatsApp Routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize sweets message and floating link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')
          old = "sweets:'السلام عليكم، استفسار عن قطاع الحلويات والسناكات - فرع الأحساء'"
          new = "sweets:'السلام عليكم، استفسار عن أسعار وطلبيات الحلويات والمقرمشات - فرع الأحساء'"
          if old not in s:
              raise SystemExit('Expected sweets message not found')
          s = s.replace(old, new, 1)
          old_floating = "${option('sweets',current==='ar'?'مبيعات الحلويات والمقرمشات — الأحساء':'Sweets & Snacks Sales — Al-Ahsa',messages.sweets)}"
          new_floating = "${option('sweets',current==='ar'?'مبيعات الحلويات والمقرمشات — الأحساء':'Sweets & Snacks Sales — Al-Ahsa','')}"
          if old_floating not in s:
              raise SystemExit('Expected sweets floating option not found')
          s = s.replace(old_floating, new_floating, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/i18n.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js .github/workflows/finalize-sweets-message.yml
          git commit -m "fix(contact): finalize sweets WhatsApp message"
          git rm .github/workflows/finalize-sweets-message.yml
          git commit -m "chore: remove temporary sweets finalization workflow"
          git push