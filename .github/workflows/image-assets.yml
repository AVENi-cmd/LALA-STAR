name: Validate image assets

on:
  push:
  pull_request:

jobs:
  image-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate referenced images and JPEG signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r"(?:src|url\\()=['\"]?([^'\")?#]+)", html)))
          local = [r for r in refs if not re.match(r'^(https?:|data:|#)', r)]

          errors = []
          for ref in local:
              path = (root / ref).resolve()
              if not path.is_file():
                  errors.append(f'Missing asset: {ref}')
                  continue
              size = path.stat().st_size
              if size == 0:
                  errors.append(f'Empty asset: {ref}')
              if path.suffix.lower() in {'.jpg', '.jpeg'}:
                  data = path.read_bytes()
                  if not data.startswith(b'\\xff\\xd8\\xff') or not data.endswith(b'\\xff\\xd9'):
                      errors.append(f'Invalid JPEG signature: {ref}')
                  if size > 5 * 1024 * 1024:
                      errors.append(f'JPEG exceeds 5 MB: {ref}')

          if errors:
              print('\\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(local)} local image references successfully.')
          PY
