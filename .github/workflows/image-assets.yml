name: Validate image assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  image-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local image references and binary signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|jpg|jpeg|png)', html)))
          errors = []

          for ref in refs:
              path = root / ref
              if not path.is_file():
                  errors.append(f'Missing asset: {ref}')
                  continue
              data = path.read_bytes()
              if not data:
                  errors.append(f'Empty asset: {ref}')
                  continue
              if path.suffix.lower() == '.webp':
                  if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                      errors.append(f'Invalid WebP RIFF header: {ref}')
                  if all(32 <= b < 127 or b in (9, 10, 13) for b in data[:128]):
                      errors.append(f'Text/Base64-like WebP detected: {ref}')
              elif path.suffix.lower() in {'.jpg', '.jpeg'}:
                  if not data.startswith(b'\xff\xd8\xff') or not data.endswith(b'\xff\xd9'):
                      errors.append(f'Invalid JPEG signature: {ref}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(refs)} local image references successfully.')
          PY
