name: Validate image assets

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/image-assets.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/image-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair approved image wiring
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          warehouse = 'assets/optimized/wholesale-warehouse-ahsa-1920.webp?v=20260917-5'
          warehouse_small = 'assets/optimized/wholesale-warehouse-ahsa-1280.webp?v=20260917-5'
          dammam = 'assets/optimized/food-products-dammam-1280.webp?v=20260917-5'
          ahsa = 'assets/optimized/food-products-ahsa-1280.webp?v=20260917-5'
          plastic = 'assets/optimized/plastic-products-960.webp?v=20260917-1'
          sweets = 'assets/optimized/sweets-snacks-960.webp?v=20260917-1'

          if '/* Approved warehouse Hero image */' not in html:
              hero_css = f'''\n    /* Approved warehouse Hero image */\n    .hero, #hero, .hero-section {{\n      background-image: linear-gradient(135deg, rgba(11,21,36,.72) 0%, rgba(17,34,56,.64) 50%, rgba(8,15,26,.78) 100%), url(\"{warehouse}\") !important;\n      background-size: cover !important;\n      background-position: center !important;\n      background-repeat: no-repeat !important;\n    }}\n'''
              html = html.replace('</style>', hero_css + '  </style>', 1)

          html = html.replace(
              '<div class="photo"><div class="caption">تجارة وتوزيع بالجملة</div></div>',
              f'<div class="photo"><img src="{warehouse_small}" alt="مستودع لألأة النجوم التجارية للجملة" width="1280" height="720" loading="lazy" decoding="async"><div class="caption">تجارة وتوزيع بالجملة</div></div>',
              1
          )

          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body">',
              f'<article class="business"><picture><img src="{ahsa}" alt="المواد الغذائية بالجملة" width="1280" height="720" loading="lazy" decoding="async"></picture><div class="business-body">',
              1
          )
          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              f'<article class="business"><picture><img src="{plastic}" alt="المنتجات البلاستيكية" loading="lazy" decoding="async"></picture><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              1
          )
          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body"><h3>الحلويات والسناكات</h3>',
              f'<article class="business"><picture><img src="{sweets}" alt="الحلويات والسناكات" loading="lazy" decoding="async"></picture><div class="business-body"><h3>الحلويات والسناكات</h3>',
              1
          )
          html = html.replace(
              '<article class="business business-no-image"><div class="business-placeholder" aria-hidden="true"></div><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              f'<article class="business"><picture><img src="{plastic}" alt="المنتجات البلاستيكية" loading="lazy" decoding="async"></picture><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              1
          )
          html = html.replace(
              '<article class="business business-no-image"><div class="business-placeholder" aria-hidden="true"></div><div class="business-body"><h3>الحلويات والسناكات</h3>',
              f'<article class="business"><picture><img src="{sweets}" alt="الحلويات والسناكات" loading="lazy" decoding="async"></picture><div class="business-body"><h3>الحلويات والسناكات</h3>',
              1
          )

          html = html.replace(
              '<article class="branch"><div class="branch-img"></div>',
              f'<article class="branch"><div class="branch-img"><img src="{dammam}" alt="فرع المواد الغذائية في الدمام" width="1280" height="720" loading="lazy" decoding="async"></div>',
              1
          )
          html = html.replace(
              '<article class="branch"><div class="branch-img"></div>',
              f'<article class="branch"><div class="branch-img"><img src="{ahsa}" alt="فرع المواد الغذائية في الأحساء" width="1280" height="720" loading="lazy" decoding="async"></div>',
              1
          )

          # The Dammam branch should reuse the same warehouse image as the
          # "المواد الغذائية بالجملة" business card.
          html = html.replace(
              f'<img src="{dammam}" alt="فرع المواد الغذائية في الدمام" width="1280" height="720" loading="lazy" decoding="async">',
              f'<img src="{ahsa}" alt="فرع المواد الغذائية في الدمام" width="1280" height="720" loading="lazy" decoding="async">',
              1
          )

          if '.business-placeholder {' not in html:
              css = '''\n    .business-placeholder { height:330px; background:linear-gradient(135deg,#d8dee7 0%,#aeb7c4 52%,#7f8997 100%); position:relative; overflow:hidden; }\n    .business-placeholder:after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 45%,rgba(15,30,54,.16)); }\n    @media(max-width:850px){.business-placeholder{height:300px}}\n    @media(max-width:520px){.business-placeholder{height:260px}}\n'''
              html = html.replace('</style>', css + '  </style>', 1)

          p.write_text(html, encoding='utf-8')

      - name: Remove duplicate branch contact rows
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          tag_re = re.compile(r'</?div\b[^>]*>', re.I)
          phone_re = re.compile(r'(?:05|٠٥)\s*[0-9٠-٩](?:[\s-]*[0-9٠-٩]){7,10}|(?:\+966|٩٦٦)\s*[0-9٠-٩](?:[\s-]*[0-9٠-٩]){7,10}', re.I)
          contact_re = re.compile(r'واتساب|اتصال|مبيعات', re.I)

          def matching_div_end(text, start):
              depth = 1
              for t in tag_re.finditer(text, start):
                  if t.group(0).startswith('</'):
                      depth -= 1
                      if depth == 0:
                          return t.end()
                  else:
                      depth += 1
              return None

          def strip_branch_contacts(text):
              cursor = 0
              result = []
              branch_pat = re.compile(r'<div\b[^>]*class=[\"\'][^\"\']*\bbranch-body\b[^\"\']*[\"\'][^>]*>', re.I)
              for m in list(branch_pat.finditer(text)):
                  if m.start() < cursor:
                      continue
                  end = matching_div_end(text, m.end())
                  if end is None:
                      continue
                  inner_end = end - len('</div>')
                  inner = text[m.end():inner_end]
                  changed = True
                  while changed:
                      changed = False
                      for child in list(re.finditer(r'<div\b[^>]*>', inner, re.I)):
                          child_end = matching_div_end(inner, child.end())
                          if child_end is None:
                              continue
                          child_html = inner[child.start():child_end]
                          if phone_re.search(child_html) or contact_re.search(child_html):
                              inner = inner[:child.start()] + inner[child_end:]
                              changed = True
                              break
                  inner = re.sub(r'<a\b[^>]*>.*?</a>', lambda a: '' if contact_re.search(a.group(0)) else a.group(0), inner, flags=re.I|re.S)
                  result.append(text[cursor:m.end()])
                  result.append(inner)
                  result.append('</div>')
                  cursor = end
              result.append(text[cursor:])
              return ''.join(result)

          updated = strip_branch_contacts(html)
          if updated != html:
              p.write_text(updated, encoding='utf-8')
              print('Removed duplicate contact rows from Locations branch cards.')
          else:
              print('No duplicate branch contact rows found.')

      - name: Validate local image references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r'assets/[A-Za-z0-9_./?=-]+\.(?:webp|jpg|jpeg|png)', html)))
          errors = []

          required = [
              'assets/optimized/wholesale-warehouse-ahsa-1920.webp',
              'assets/optimized/wholesale-warehouse-ahsa-1280.webp',
              'assets/optimized/food-products-ahsa-1280.webp',
              'assets/optimized/food-products-dammam-1280.webp',
              'assets/optimized/plastic-products-960.webp',
              'assets/optimized/sweets-snacks-960.webp',
          ]
          for ref in required:
              if not (root / ref).is_file():
                  errors.append(f'Required approved image missing: {ref}')

          for ref in refs:
              path = root / ref.split('?', 1)[0]
              if not path.is_file():
                  errors.append(f'Missing asset: {ref}')

          for bad in ['<div class="photo"><div class="caption">', '<div class="branch-img"></div>', '<picture></picture>', '<div class="business-placeholder"']:
              if bad in html:
                  errors.append(f'Empty image container remains: {bad}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(refs)} local image references successfully.')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No image wiring or branch contact changes required.'
            exit 0
          fi
          git commit -m 'fix(locations): remove duplicate contact rows'
          git push origin main
