name: Production readiness checks

on:
  push:
    branches: [main, qa/production-readiness]
  pull_request:

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run production audit
        run: python3 scripts/production-check.py
