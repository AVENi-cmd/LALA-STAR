name: Temporary Footer Update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-footer-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer verification text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="verification"><strong>السجل التجاري:</strong> [رقم السجل] · <strong>الرقم الضريبي:</strong> [الرقم الضريبي] · <strong>موثق لدى منصة الأعمال</strong></div>'''
          new='''<div class="verification"><strong>السجل التجاري:</strong> 2252101993 · <strong>الرقم الضريبي:</strong> 310275588900003 · <strong>موثق لدى منصة الأعمال</strong></div>'''
          if old not in s:
              raise SystemExit('Expected Arabic footer placeholder not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('assets/i18n.js')
          s=p.read_text(encoding='utf-8')
          needle="    'السجل التجاري':'Commercial Register',"
          addition="    'السجل التجاري':'Commercial Register','السجل التجاري: 2252101993 · الرقم الضريبي: 310275588900003 · موثق لدى منصة الأعمال':'CR: 2252101993 · VAT: 310275588900003 · Verified on Saudi Business Platform',"
          if needle not in s:
              raise SystemExit('Expected i18n anchor not found')
          p.write_text(s.replace(needle,addition,1),encoding='utf-8')

          # Remove this temporary workflow before committing; no image or image-path content is touched.
          Path('.github/workflows/temp-footer-update.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/i18n.js .github/workflows/temp-footer-update.yml
          git commit -m "fix(footer): update commercial registration and VAT details"
          git push
