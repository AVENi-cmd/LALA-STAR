name: Final Language Cache Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch language asset versioning
        shell: python
        run: |
          from pathlib import Path
          import re

          version='20260916-2'
          p=Path('scripts/build-webp.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'<script src=\"assets/i18n.js\" defer></script>'", "f'<script src=\"assets/i18n.js?v={version}\" defer></script>'")
          p.write_text(s,encoding='utf-8')

          h=Path('index.html')
          hs=h.read_text(encoding='utf-8')
          hs=re.sub(r'<script src=[\"\']assets/i18n\\.js(?:\\?v=[^\"\']+)?[\"\'] defer></script>', f'<script src=\"assets/i18n.js?v={version}\" defer></script>', hs)
          h.write_text(hs,encoding='utf-8')

          j=Path('assets/i18n.js')
          js=j.read_text(encoding='utf-8')
          marker="window.setLanguage=setLanguage;"
          if marker in js and "window.addEventListener('pageshow'" not in js:
              js=js.replace(marker, "window.addEventListener('pageshow',()=>{const saved=localStorage.getItem(KEY);if(saved==='ar'||saved==='en'){current=saved;translate();}});\n"+marker)
          j.write_text(js,encoding='utf-8')

      - name: Validate
        run: node --check assets/i18n.js

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-language-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/i18n.js scripts/build-webp.py .github/workflows/fix-language-final.yml
          git commit -m 'fix(i18n): bust cache and stabilize language switching'
          git push
