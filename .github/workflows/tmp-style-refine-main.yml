name: Temporary CSS Refinement on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply CSS-only change and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          o=p.read_text(encoding='utf-8')
          m=re.search(r'<style>(.*?)</style>',o,re.S)
          if not m: raise SystemExit('No style block')
          s=m.group(1)
          marker='/* Premium card and separator refinement */'
          s=re.sub(r'\n\s*/\* Premium card and separator refinement \*/.*', '', s, flags=re.S)
          add='''\n    /* Premium card and separator refinement */\n    .benefit,.client-card,.business{border:1px solid rgba(15,23,42,0.08);transition:transform 0.25s ease,box-shadow 0.25s ease,border-color 0.25s ease;}\n    .benefit:hover,.client-card:hover,.business:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(15,23,42,0.06);border-color:rgba(220,38,38,0.2);}\n    .client-card .client-num{color:#e51d35;}\n    .stats,.stat{border-color:rgba(15,23,42,0.08);}\n    .footer-number{direction:ltr;unicode-bidi:isolate;white-space:nowrap;color:inherit !important;text-decoration:none !important;-webkit-text-decoration:none !important;}\n    .footer-number a,a .footer-number{color:inherit !important;text-decoration:none !important;-webkit-text-decoration:none !important;}\n'''
          u=o[:m.start(1)]+s.rstrip()+add+o[m.end(1):]
          if re.sub(r'(<style>).*?(</style>)',r'\1STYLE\2',o,re.S)!=re.sub(r'(<style>).*?(</style>)',r'\1STYLE\2',u,re.S): raise SystemExit('Outside style changed')
          if re.findall(r'<img\b[^>]*>',o,re.S)!=re.findall(r'<img\b[^>]*>',u,re.S): raise SystemExit('Image tags changed')
          p.write_text(u,encoding='utf-8')
          PY
          git add index.html
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): refine cards and section separators"
          git push origin main
