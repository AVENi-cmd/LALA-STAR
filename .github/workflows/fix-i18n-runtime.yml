name: Stabilize Arabic i18n Runtime

on:
  push:
    branches: [main]
    paths:
      - 'assets/i18n.js'
      - 'index.html'
      - '.github/workflows/fix-i18n-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch language bootstrap and runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "let current=localStorage.getItem(KEY)||defaultLang;\nif(current!=='ar'&&current!=='en')current=defaultLang;",
              "const savedLang=localStorage.getItem(KEY);\nlet currentLang=(savedLang==='ar'||savedLang==='en')?savedLang:defaultLang;\nlet current=currentLang;"
          )

          s = s.replace(
              "current=lang;\n localStorage.setItem(KEY,current);",
              "current=lang;\n currentLang=lang;\n localStorage.setItem(KEY,current);"
          )

          old = "window.addEventListener('pageshow',()=>{const saved=localStorage.getItem(KEY);if(saved==='ar'||saved==='en'){current=saved;translate();}});"
          new = "window.addEventListener('pageshow',()=>{const saved=localStorage.getItem(KEY);current=(saved==='ar'||saved==='en')?saved:defaultLang;currentLang=current;translate();injectWholesale();injectContacts();floating();secure();const b=document.querySelector('.lang,[data-lang-toggle]');if(b)b.textContent=current==='ar'?'English':'العربية';});"
          s = s.replace(old, new)

          marker = "const map=current==='ar'?reverseDictionary:dictionary;"
          insert = "document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;const value=labels[current]?.[key]??(current==='en'?dictionary[key]:reverseDictionary[key]);if(value)el.textContent=value;});\n "
          s = s.replace(marker, insert + marker)

          p.write_text(s, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'assets/i18n\.js(?:\?v=[^"\']+)?" defer', 'assets/i18n.js?v=20260917-1" defer', html)
          if 'assets/i18n.js?v=20260917-1" defer' not in html:
              html = html.replace('</body>', '<script src="assets/i18n.js?v=20260917-1" defer></script>\n</body>', 1)
          index.write_text(html, encoding='utf-8')

      - name: Validate
        run: |
          set -euo pipefail
          node --check assets/i18n.js
          grep -q '<html lang="ar" dir="rtl">' index.html
          grep -q 'assets/i18n.js?v=20260917-1" defer' index.html
          grep -q "const savedLang=localStorage.getItem(KEY)" assets/i18n.js
          grep -q "let currentLang=" assets/i18n.js
          grep -q "window.toggleLanguage" assets/i18n.js

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/i18n.js index.html
          if git diff --cached --quiet; then
            echo 'Runtime already normalized.'
            exit 0
          fi
          git commit -m 'fix(i18n): enforce Arabic bootstrap and stable language runtime [skip ci]'
          git push origin HEAD:main
