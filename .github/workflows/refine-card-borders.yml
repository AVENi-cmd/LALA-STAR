name: Refine Card Borders

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'fix(ui): refine activity and benefit card borders'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Update CSS inside style only
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('index.html')
          original = path.read_text(encoding='utf-8')

          style_match = re.search(r'<style>(.*?)</style>', original, flags=re.S)
          if not style_match:
              raise SystemExit('No style block found')

          style = style_match.group(1)
          marker = '/* Refined activity and benefit card borders */'
          if marker in style:
              raise SystemExit('Refinement already present')

          addition = '\n    /* Refined activity and benefit card borders */\n    .benefit,.business{border:1px solid rgba(15,23,42,0.09)}\n'
          updated_style = style.rstrip() + addition
          updated = original[:style_match.start(1)] + updated_style + original[style_match.end(1):]

          # Hard guard: everything outside <style> must remain byte-for-byte identical.
          before = re.sub(r'(<style>).*?(</style>)', r'\\1STYLE_CONTENT\\2', original, flags=re.S)
          after = re.sub(r'(<style>).*?(</style>)', r'\\1STYLE_CONTENT\\2', updated, flags=re.S)
          if before != after:
              raise SystemExit('Guard failed: content outside <style> changed')

          path.write_text(updated, encoding='utf-8')

      - name: Verify image tags and image paths are unchanged
        shell: bash
        run: |
          git show HEAD:index.html > /tmp/index-before.html
          python - <<'PY'
          from pathlib import Path
          import re
          before = Path('/tmp/index-before.html').read_text(encoding='utf-8')
          after = Path('index.html').read_text(encoding='utf-8')
          def images(text):
              return re.findall(r'<img\b[^>]*>', text, flags=re.S)
          if images(before) != images(after):
              raise SystemExit('Guard failed: <img> tags changed')
          PY

      - name: Commit final CSS-only change and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-card-borders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-card-borders.yml
          git diff --cached --check
          git commit -m "fix(ui): refine activity and benefit card borders"
          git push origin HEAD:main
