name: One-time Footer Update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/footer-update-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer verification text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="verification"><strong>السجل التجاري:</strong> [رقم السجل] · <strong>الرقم الضريبي:</strong> [الرقم الضريبي] · <strong>موثق لدى منصة الأعمال</strong></div>'
          new = '<div class="verification"><strong>السجل التجاري:</strong> 2252101993 · <strong>الرقم الضريبي:</strong> 310275588900003 · <strong>موثق لدى منصة الأعمال</strong></div>'
          if old not in s:
              raise SystemExit('Expected Arabic footer placeholder not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')
          ar = 'السجل التجاري: 2252101993 · الرقم الضريبي: 310275588900003 · موثق لدى منصة الأعمال'
          en = 'CR: 2252101993 · VAT: 310275588900003 · Verified on Saudi Business Platform'
          if ar not in s:
              marker = "'السجل التجاري':'Commercial Register',"
              if marker not in s:
                  raise SystemExit('Expected i18n anchor not found')
              s = s.replace(marker, marker + "'" + ar + "':'" + en + "',", 1)
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/footer-update-once.yml').unlink()
          PY
      - name: Commit footer update and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/i18n.js .github/workflows/footer-update-once.yml
          git commit -m "fix(footer): update commercial registration and VAT details"
          git push
