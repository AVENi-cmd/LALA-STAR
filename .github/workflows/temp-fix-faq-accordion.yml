name: temp FAQ accordion fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix FAQ accordion CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n    /* FAQ accordion expansion and readable answers */\n    .faq-list details{height:auto !important;max-height:none !important;overflow:visible !important}\n    .faq-list details summary{display:list-item;cursor:pointer;padding:18px 22px;font-weight:700}\n    .faq-list details summary::-webkit-details-marker{display:inline-block}\n    .faq-list details summary::marker{font-size:1em}\n    .faq-list details .faq-answer{height:auto !important;max-height:none !important;overflow:visible !important;color:#555}\n    .faq-list details .faq-answer-inner{padding:14px 22px 18px;color:#555;line-height:1.8}\n'''
          if '/* FAQ accordion expansion and readable answers */' not in s:
              s=s.replace('</style>',css+'  </style>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '<details class="faq-item">' index.html
          grep -Fq '<summary class="faq-question">' index.html
          grep -Fq '/* FAQ accordion expansion and readable answers */' index.html
          grep -Fq 'overflow:visible !important' index.html
          grep -Fq 'height:auto !important' index.html
          grep -Fq 'color:#555' index.html
          grep -Fq 'cursor:pointer' index.html
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix(ui): make FAQ accordion expandable'
          git push origin main
