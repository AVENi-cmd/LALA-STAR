name: Fix Arabic Default Language

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Arabic the fresh default language
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')
          old = "const KEY='pref_lang';"
          new = "const KEY='pref_lang_v2';"
          if old not in s:
              raise SystemExit('Expected language key not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/i18n.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js
          git commit -m "fix(i18n): make Arabic the default language"
          git rm .github/workflows/fix-arabic-default.yml
          git commit -m "chore: remove temporary Arabic language workflow"
          git push
