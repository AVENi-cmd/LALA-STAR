name: temp-approved-content-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved content fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="tel:0138562508" dir="ltr">0138562508</a>','<a href="tel:+966138562508" dir="ltr">013 856 2508</a>')
          s=s.replace('<a href="tel:+966138562508" dir="ltr">0138562508</a>','<a href="tel:+966138562508" dir="ltr">013 856 2508</a>')
          s=s.replace('<div></div></header>','</header>')
          s=s.replace('assets/wide_high_resolution_supermarket_warehouse_aisle.png','assets/wide_high_resolution_supermarket_warehouse_aisle.webp')
          for a,b in {
            '<div class="kicker">ABOUT US</div>':'<div class="kicker">من نحن</div>',
            '<div class="kicker">WHY LALA STAR</div>':'<div class="kicker">مزايا التوريد</div>',
            '<div class="kicker">OUR BUSINESSES</div>':'<div class="kicker">أنشطتنا</div>',
            '<div class="kicker">OUR TARGET CLIENTS</div>':'<div class="kicker">قطاعات العملاء</div>',
            '<div class="kicker">LOCATIONS</div>':'<div class="kicker">فروعنا</div>',
            '<div class="kicker">FAQ</div>':'<div class="kicker">الأسئلة الشائعة</div>',
            '<div class="kicker">CONTACT</div>':'<div class="kicker">تواصل معنا</div>',
          }.items(): s=s.replace(a,b)
          s=s.replace('<a class="btn secondary" href="#contact">تواصل معنا</a>','<a class="btn secondary" href="#contact">اطلب تسعيرة جملة</a>')
          old='''<div class="faq-list"><article class="faq-item"><button class="faq-question" type="button" aria-expanded="false"><span>هل توفرون التوصيل للدمام والأحساء وضواحيها؟</span><span aria-hidden="true">+</span></button><div class="faq-answer"><div class="faq-answer-inner">نعم، يتوفر أسطول نقل منتظم للمنشآت التجارية.</div></div></article><article class="faq-item"><button class="faq-question" type="button" aria-expanded="false"><span>ما هي آلية الحصول على قائمة الأسعار والكميات؟</span><span aria-hidden="true">+</span></button><div class="faq-answer"><div class="faq-answer-inner">حضورك ورؤية المنتجات واختيار المنتج المناسب لك أو الإتصال عبر الهاتف للحصول على تسعيرة فورية.</div></div></article><article class="faq-item"><button class="faq-question" type="button" aria-expanded="false"><span>هل يمكن طلب تسعيرة حسب الفرع؟</span><span aria-hidden="true">+</span></button><div class="faq-answer"><div class="faq-answer-inner">نعم، يمكن تحديد الفرع المستهدف عند التواصل لإرسال طلب التسعيرة المناسب.</div></div></article><article class="faq-item"><button class="faq-question" type="button" aria-expanded="false"><span>كيف أبدأ التعامل التجاري مع الشركة؟</span><span aria-hidden="true">+</span></button><div class="faq-answer"><div class="faq-answer-inner">يمكنك التواصل عبر الهاتف أو البريد الإلكتروني وذكر نشاط المنشأة والأصناف والكميات المطلوبة للبدء.</div></div></article></div>'''
          new='''<div class="faq-list"><details class="faq-item"><summary class="faq-question">هل توفرون التوصيل للدمام والأحساء وضواحيها؟</summary><div class="faq-answer"><div class="faq-answer-inner">نعم، يتوفر أسطول نقل منتظم للمنشآت التجارية.</div></div></details><details class="faq-item"><summary class="faq-question">ما هي آلية الحصول على قائمة الأسعار والكميات؟</summary><div class="faq-answer"><div class="faq-answer-inner">يمكنك الحضور ورؤية المنتجات واختيار المنتج المناسب لك أو الاتصال عبر الهاتف للحصول على تسعيرة فورية.</div></div></details><details class="faq-item"><summary class="faq-question">هل يمكن طلب تسعيرة حسب الفرع؟</summary><div class="faq-answer"><div class="faq-answer-inner">نعم، يمكن تحديد الفرع المستهدف عند التواصل لإرسال طلب التسعيرة المناسب.</div></div></details><details class="faq-item"><summary class="faq-question">كيف أبدأ التعامل التجاري مع الشركة؟</summary><div class="faq-answer"><div class="faq-answer-inner">يمكنك التواصل عبر الهاتف أو البريد الإلكتروني وذكر نشاط المنشأة والأصناف والكميات المطلوبة للبدء.</div></div></details></div>'''
          if old in s: s=s.replace(old,new)
          needle='.faq-list{max-width:900px;margin:auto;display:grid;gap:12px}'
          css=needle+' .faq-list details{margin:0;padding:0;border:1px solid rgba(15,30,54,.12);border-radius:12px;background:rgba(255,255,255,.65);overflow:hidden}.faq-list details summary{list-style:none;cursor:pointer}.faq-list details summary::-webkit-details-marker{display:none}.faq-list details[open] summary{border-bottom:1px solid rgba(15,30,54,.1)}.faq-list details .faq-answer-inner{padding:14px 22px 18px}'
          if needle in s and '.faq-list details{margin:0' not in s: s=s.replace(needle,css,1)
          old_js="document.querySelectorAll('.faq-question').forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('.faq-item'),open=item.classList.contains('open');document.querySelectorAll('.faq-item.open').forEach(i=>{i.classList.remove('open');i.querySelector('.faq-question').setAttribute('aria-expanded','false')});if(!open){item.classList.add('open');btn.setAttribute('aria-expanded','true')}}));"
          s=s.replace(old_js,'')
          p.write_text(s)
          PY
      - name: Validate scope
        run: |
          test "$(grep -o 'wide_high_resolution_supermarket_warehouse_aisle\.png' index.html | wc -l)" -eq 0
          grep -q 'assets/wide_high_resolution_supermarket_warehouse_aisle.webp' index.html
          grep -q 'href="tel:+966138562508" dir="ltr">013 856 2508' index.html
          grep -q '<details class="faq-item">' index.html
          grep -q '<summary class="faq-question">' index.html
          grep -q 'اطلب تسعيرة جملة' index.html
          ! grep -q '<div></div></header>' index.html
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(content): localize sections, repair phone, and modernize FAQ'
          git push origin HEAD:main
