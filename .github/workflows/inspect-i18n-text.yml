name: Inspect remaining i18n text variants

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print requested text contexts
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          terms = ['الرئيسية','الأقسام','المواد الغذائية','البلاستيك','الحلويات','استعراض','5,000','الفرع الرئيسي','فرع الأحساء','قسم المواد','قسم البلاستيك','قسم الحلويات','اتصال','واتساب','ساعات العمل','السبت','شركة لألأة النجوم','السجل التجاري','جميع الحقوق','منصة التوريد']
          for term in terms:
              hits = re.findall('.{0,100}' + re.escape(term) + '.{0,140}', html)
              print('\n###', term, '###')
              for hit in hits[:8]:
                  print(hit.replace('\n',' '))
          PY
