name: Temporary card style refinement
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-card-style.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update style only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          a = s.index('<style>') + len('<style>')
          b = s.index('</style>', a)
          before, css, after = s[:a], s[a:b], s[b:]
          old = css
          targets = [
              '.benefit,.client-card,.business,.branch,.faq-item{background:var(--card);border:1px solid rgba(15,30,54,.08);',
          ]
          if targets[0] not in css:
              raise SystemExit('Expected card rule not found')
          css = css.replace(
              '.benefit,.client-card,.business,.branch,.faq-item{background:var(--card);border:1px solid rgba(15,30,54,.08);',
              '.benefit,.client-card,.business,.branch,.faq-item{background:var(--card);border:1.5px solid rgba(15,23,42,.16) !important;border-right:3.5px solid #dc2626 !important;',
              1,
          )
          css = css.replace(
              '.benefit,.client-card{border-radius:20px;padding:26px 22px;transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease,border-color .3s ease}',
              '.benefit,.client-card{border-radius:20px;padding:26px 22px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}',
              1,
          )
          css = css.replace(
              '.benefit:hover,.client-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 35px -8px rgba(15,30,54,.13),0 10px 14px -8px rgba(15,30,54,.05);border-color:rgba(229,29,53,.2)}',
              '.benefit:hover,.client-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(15,23,42,.06);border-color:rgba(220,38,38,.2)}',
              1,
          )
          css = css.replace(
              '.business{border-radius:20px;overflow:hidden;position:relative;transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease}',
              '.business{border-radius:20px;overflow:hidden;position:relative;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}',
              1,
          )
          css = css.replace(
              '.business:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 35px -8px rgba(15,30,54,.15)}',
              '.business:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(15,23,42,.06);border-color:rgba(220,38,38,.2)}',
              1,
          )
          css += '\n    /* Mobile touch feedback for activity and benefit cards */\n    .benefit:active,.client-card:active,.business:active{transform:scale(.99);}\n'
          if css == old:
              raise SystemExit('No CSS changes made')
          # Absolute safety checks: only bytes inside <style> may change.
          out = before + css + after
          if out[:a] != s[:a] or out[b + len('</style>'):] != s[b + len('</style>'):]:
              raise SystemExit('Content outside <style> changed')
          import re
          if re.findall(r'<img\b[^>]*>', out, re.I) != re.findall(r'<img\b[^>]*>', s, re.I):
              raise SystemExit('IMG tags changed')
          p.write_text(out, encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- index.html
          if [ "$(git diff --name-only)" != "index.html" ]; then echo 'Unexpected files changed'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(ui): strengthen card borders and mobile touch feedback'
          git push origin main
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/temp-card-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary card style workflow'
          git push origin main
