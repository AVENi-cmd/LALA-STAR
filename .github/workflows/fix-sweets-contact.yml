name: Apply Sweets Contact Correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch contact configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "foodDammam:'966546273827',foodAhsa1:'966500517660',foodAhsa2:'966533511159',",
              "foodDammam:'966546273827',foodAhsa1:'966500517660',foodAhsa2:'966533511159',sweets:'966558423342',"
          )
          s = s.replace(
              "plasticDammam:'055 056 1719',plasticAhsa:'050 674 4437',office:'013 856 2508'",
              "plasticDammam:'055 056 1719',plasticAhsa:'050 674 4437',sweets:'055 842 3342',office:'013 856 2508'"
          )
          s = s.replace(
              "{label:'المنتجات البلاستيكية',key:'plasticAhsa',message:messages.plasticAhsa}",
              "{label:'المنتجات البلاستيكية',key:'plasticAhsa',message:messages.plasticAhsa},\n       {label:'الحلويات والمقرمشات',key:'sweets',message:messages.sweets}"
          )
          s = s.replace(
              "wrap.appendChild(contactCard(labels[current].office,[contactRow(labels[current].office,'office','')]).replaceChildren);",
              "wrap.appendChild(contactCard(labels[current].office,[contactRow(labels[current].office,'office','')]));"
          )
          marker = "${option('plasticAhsa',`${labels[current].plasticSales} — ${labels[current].ahsa}`,messages.plasticAhsa)}"
          replacement = marker + "${option('sweets',current==='ar'?'مبيعات الحلويات والمقرمشات — الأحساء':'Sweets & Snacks Sales — Al-Ahsa',messages.sweets)}"
          s = s.replace(marker, replacement)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/i18n.js
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js .github/workflows/fix-sweets-contact.yml
          git commit -m "fix(contact): add sweets sales number and WhatsApp channel"
          git rm .github/workflows/fix-sweets-contact.yml
          git commit -m "chore: remove temporary contact patch workflow"
          git push