name: Fix Footer Cache Detection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-footer-cache.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bust i18n cache and disable telephone detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_meta = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          new_meta = '<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="format-detection" content="telephone=no">'
          if old_meta not in s:
              raise SystemExit('Expected viewport meta tag not found')
          s = s.replace(old_meta, new_meta, 1)
          old_src = '<script src="assets/i18n.js?v=20260917-1" defer></script>'
          new_src = '<script src="assets/i18n.js?v=20260917-2" defer></script>'
          if old_src not in s:
              raise SystemExit('Expected i18n script tag not found')
          s = s.replace(old_src, new_src, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-footer-cache.yml

      - name: Commit and push final footer cache fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(footer): bust stale i18n cache and phone detection"
          git push origin HEAD:main
