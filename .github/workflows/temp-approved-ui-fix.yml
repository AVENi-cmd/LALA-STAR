name: Temporary Approved UI Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply scoped UI fixes with invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          if 'data-approved-ui-fix="1"' in s:
              print('Fix already present; no index.html change needed.')
          else:
              imgs_before = re.findall(r'<img\b[^>]*>', s, flags=re.I|re.S)
              m = re.search(r'<style\b[^>]*>(.*?)</style>', s, flags=re.I|re.S)
              if not m:
                  raise SystemExit('No style block found')
              style = m.group(1)

              old = '.benefit,.client-card,.business,.branch,.faq-item{background:var(--card);border:1.5px solid rgba(15,23,42,.16) !important;border-right:3.5px solid #dc2626 !important;'
              new = '.benefit,.client-card,.business{background:var(--card);border:1.5px solid rgba(15,23,42,.16) !important;border-right:3.5px solid #dc2626 !important;'
              if old not in style:
                  raise SystemExit('Expected card selector not found; refusing to edit')
              style = style.replace(old, new, 1)

              touch = '.menu,.lang{min-width:44px;min-height:44px;} .map,.quote-options a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;} .benefit:active,.client-card:active,.business:active{transform:scale(.99);}'
              if '.menu,.lang{min-width:44px;min-height:44px;}' not in style:
                  style += '\n    /* Approved mobile touch-target refinement */\n    ' + touch + '\n'

              s = s[:m.start(1)] + style + s[m.end(1):]
              s = s.replace('<head>', '<head data-approved-ui-fix="1">', 1)

              imgs_after = re.findall(r'<img\b[^>]*>', s, flags=re.I|re.S)
              if imgs_before != imgs_after:
                  raise SystemExit('IMG TAG INVARIANT FAILED')

              def outside_style(x):
                  return re.sub(r'<style\b[^>]*>.*?</style>', '<style>__STYLE__</style>', x, flags=re.I|re.S)
              if outside_style(original) != outside_style(s):
                  raise SystemExit('NON-STYLE CONTENT INVARIANT FAILED')

              p.write_text(s, encoding='utf-8')
              print('index.html updated: scoped card borders + mobile touch targets')
          PY

      - name: Commit index fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html changes; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(ui): scope card borders and improve mobile touch targets'
          git push

      - name: Remove temporary workflow after index fix is present
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'data-approved-ui-fix="1"' index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm .github/workflows/temp-approved-ui-fix.yml
            git commit -m 'chore: remove temporary UI fix workflow'
            git push
          fi
