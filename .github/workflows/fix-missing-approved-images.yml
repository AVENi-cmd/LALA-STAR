name: Fix Missing Approved Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-missing-approved-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore image references and Hero styling
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (r'assets/(?:images|optimized)/lala[-_]wholesale\.(?:webp|jpg|jpeg|png)(?:\?[^"\' )>]*)?', 'assets/optimized/wholesale-warehouse-ahsa-1920.webp?v=20260917-2'),
              (r'assets/(?:images|optimized)/lala[-_]ahsa\.(?:webp|jpg|jpeg|png)(?:\?[^"\' )>]*)?', 'assets/optimized/food-products-ahsa-1280.webp?v=20260917-2'),
              (r'assets/(?:images|optimized)/lala[-_]dammam\.(?:webp|jpg|jpeg|png)(?:\?[^"\' )>]*)?', 'assets/optimized/food-products-dammam-1280.webp?v=20260917-2'),
          ]
          for pattern, replacement in replacements:
              text = re.sub(pattern, replacement, text, flags=re.I)

          hero_css = '''\n    /* Approved institutional Hero palette */\n    .hero, #hero, .hero-section {\n      background: linear-gradient(135deg, #0b1524 0%, #112238 50%, #080f1a 100%) !important;\n      color: #ffffff !important;\n    }\n    .hero h1, .hero h2, .hero p, .hero span {\n      color: #ffffff !important;\n    }\n'''
          if '/* Approved institutional Hero palette */' not in text:
              text = text.replace('</style>', hero_css + '  </style>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify approved image assets exist
        run: |
          test -f assets/optimized/wholesale-warehouse-ahsa-1920.webp
          test -f assets/optimized/food-products-ahsa-1280.webp
          test -f assets/optimized/food-products-dammam-1280.webp

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix(images): restore approved warehouse image references'
          git push
