name: Build WebP Binary Assets

on:
  push:
    branches:
      - main
      - feature/section-images
    paths:
      - 'assets/warehouse-hero.jpg'
      - 'assets/food-products.jpg'
      - 'assets/plastic-products.jpg'
      - 'assets/sweets-snacks.jpg'
      - 'scripts/build-webp.py'
      - '.github/workflows/build-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Build real WebP binary files
        run: python scripts/build-webp.py

      - name: Validate WebP signatures and sizes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/images/*.webp)

          if [ "${#files[@]}" -eq 0 ]; then
            echo 'ERROR: No WebP files generated.'
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Validating $file"
            size=$(stat -c%s "$file")
            if [ "$size" -le 0 ]; then
              echo "ERROR: Empty file: $file"
              exit 1
            fi
            if [ "$size" -gt 5242880 ]; then
              echo "ERROR: File exceeds 5 MiB: $file"
              exit 1
            fi

            python - "$file" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          data = p.read_bytes()
          if len(data) < 12:
              raise SystemExit(f'Invalid WebP: {p} is shorter than 12 bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit(f'Invalid WebP RIFF header: {p}')
          if data[:1].isdigit() or all(32 <= b < 127 or b in (9, 10, 13) for b in data[:128]):
              raise SystemExit(f'File appears to contain text/Base64 instead of binary WebP: {p}')
          print(f'OK: {p} | {len(data)} bytes | RIFF/WEBP')
          PY

            file "$file"
          done

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add assets/images

          if git diff --cached --quiet; then
            echo 'No WebP changes to commit.'
            exit 0
          fi

          git commit -m 'fix(images): generate valid binary WebP assets [skip ci]'

      - name: Rebase and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
