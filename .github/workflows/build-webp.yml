name: Build WebP Binary Assets

on:
  push:
    branches:
      - main
      - feature/section-images
      - fix/seo-metadata-pr
      - feat/accessibility
    paths:
      - 'assets/optimized/**'
      - 'assets/i18n.js'
      - 'scripts/build-webp.py'
      - '.github/workflows/build-webp.yml'
      - 'food-products-ahsa-640.webp'
      - 'food-products-ahsa-1280.webp'
      - 'food-products-dammam-640.webp'
      - 'food-products-dammam-1280.webp'
      - 'plastic-products-640.webp'
      - 'plastic-products-1280.webp'
      - 'sweets-snacks-640.webp'
      - 'sweets-snacks-1280.webp'
      - 'wholesale-warehouse-ahsa-640.webp'
      - 'wholesale-warehouse-ahsa-1280.webp'
      - 'wholesale-warehouse-ahsa-1920.webp'
      - 'ASSET-MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Relocate manually uploaded approved assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/optimized
          moved=0
          for file in \
            food-products-ahsa-640.webp \
            food-products-ahsa-1280.webp \
            food-products-dammam-640.webp \
            food-products-dammam-1280.webp \
            plastic-products-640.webp \
            plastic-products-1280.webp \
            sweets-snacks-640.webp \
            sweets-snacks-1280.webp \
            wholesale-warehouse-ahsa-640.webp \
            wholesale-warehouse-ahsa-1280.webp \
            wholesale-warehouse-ahsa-1920.webp \
            ASSET-MANIFEST.json; do
            if [ -f "$file" ]; then
              cp -f "$file" "assets/optimized/$file"
              rm -f "$file"
              moved=1
            fi
          done
          if [ "$moved" -eq 1 ]; then
            echo 'OK: copied uploaded approved assets into assets/optimized and removed root duplicates.'
          else
            echo 'OK: no root-level approved assets required relocation.'
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Build approved image assets and wire full-page i18n
        run: python scripts/build-webp.py
      - name: Validate generated and approved assets and i18n
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/optimized/*-640.webp assets/optimized/*-1280.webp assets/optimized/*-1600.webp; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -le 0 ] || [ "$size" -gt 5242880 ]; then echo "ERROR: invalid file size: $file"; exit 1; fi
            python - "$file" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          p=Path(sys.argv[1]); data=p.read_bytes()
          if len(data)<12 or data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': raise SystemExit(f'Invalid WebP RIFF header: {p}')
          with Image.open(p) as im:
              if im.format != 'WEBP': raise SystemExit(f'Invalid WebP format: {p}')
          print(f'OK: {p} | {len(data)} bytes | RIFF/WEBP')
          PY
          done
          for file in \
            assets/optimized/food-products-ahsa-640.webp \
            assets/optimized/food-products-ahsa-1280.webp \
            assets/optimized/food-products-dammam-640.webp \
            assets/optimized/food-products-dammam-1280.webp \
            assets/optimized/plastic-products-640.webp \
            assets/optimized/plastic-products-1280.webp \
            assets/optimized/sweets-snacks-640.webp \
            assets/optimized/sweets-snacks-1280.webp \
            assets/optimized/wholesale-warehouse-ahsa-640.webp \
            assets/optimized/wholesale-warehouse-ahsa-1280.webp \
            assets/optimized/wholesale-warehouse-ahsa-1920.webp; do
            [ -f "$file" ] || { echo "ERROR: approved asset missing: $file"; exit 1; }
          done
          if grep -q 'images.unsplash.com' index.html; then echo 'ERROR: Remote Unsplash image references remain.'; exit 1; fi
          grep -q 'assets/i18n.js' index.html
          grep -q 'assets/optimized/food-products-1600.webp' index.html
          grep -q 'assets/optimized/plastic-products-1600.webp' index.html
          grep -q 'assets/optimized/sweets-snacks-1600.webp' index.html
          grep -q 'assets/optimized/warehouse-hero-1600.webp' index.html
          grep -q 'lalastar-language' assets/i18n.js
          grep -q 'localStorage.setItem' assets/i18n.js
          grep -q 'Our Businesses' assets/i18n.js
          grep -q 'Our Branches & Locations' assets/i18n.js
          grep -q 'Contact LALA STAR TRADING CO.' assets/i18n.js
          echo 'OK: approved image sources and full-page bilingual validation passed.'
      - name: Commit generated index wiring and relocated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets/optimized food-products-ahsa-640.webp food-products-ahsa-1280.webp food-products-dammam-640.webp food-products-dammam-1280.webp plastic-products-640.webp plastic-products-1280.webp sweets-snacks-640.webp sweets-snacks-1280.webp wholesale-warehouse-ahsa-640.webp wholesale-warehouse-ahsa-1280.webp wholesale-warehouse-ahsa-1920.webp ASSET-MANIFEST.json
          if git diff --cached --quiet; then echo 'No generated changes to commit.'; exit 0; fi
          git commit -m 'fix(images): install approved uploaded assets in optimized directory [skip ci]'
      - name: Rebase and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
