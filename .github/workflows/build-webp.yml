name: Build WebP Binary Assets

on:
  push:
    branches:
      - main
      - feature/section-images
      - fix/seo-metadata-pr
      - feat/accessibility
    paths:
      - 'assets/optimized/**'
      - 'scripts/build-webp.py'
      - 'scripts/accessibility-patch.py'
      - 'scripts/i18n-patch.py'
      - 'scripts/i18n-extra.py'
      - '.github/workflows/build-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Prepare high-quality activity sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/optimized')
          for name in ('food-products','plastic-products','sweets-snacks'):
              src=root/f'{name}-1600.jpg'
              dst=root/f'{name}-1600.webp'
              with Image.open(src) as im:
                  im.convert('RGB').save(dst,'WEBP',quality=94,method=6)
              print(f'Prepared {dst} from {src}')
          PY
      - name: Build and wire local WebP assets
        run: python scripts/build-webp.py
      - name: Apply accessibility markup
        run: python scripts/accessibility-patch.py
      - name: Apply full-page bilingual translations
        run: python scripts/i18n-patch.py && python scripts/i18n-extra.py
      - name: Validate WebP signatures, sizes, source references, accessibility, and i18n
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/images/*.webp)
          if [ "${#files[@]}" -eq 0 ]; then echo 'ERROR: No WebP files generated.'; exit 1; fi
          for file in "${files[@]}"; do
            size=$(stat -c%s "$file")
            if [ "$size" -le 0 ] || [ "$size" -gt 5242880 ]; then echo "ERROR: invalid file size: $file"; exit 1; fi
            python - "$file" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); data=p.read_bytes()
          if len(data)<12 or data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': raise SystemExit(f'Invalid WebP RIFF header: {p}')
          if all(32<=b<127 or b in (9,10,13) for b in data[:128]): raise SystemExit(f'Text/Base64-like WebP: {p}')
          print(f'OK: {p} | {len(data)} bytes | RIFF/WEBP')
          PY
          done
          if grep -q 'images.unsplash.com' index.html; then echo 'ERROR: Remote Unsplash image references remain.'; exit 1; fi
          grep -q 'lalastar-language' index.html
          grep -q 'localStorage.setItem' index.html
          grep -q 'document.documentElement.dir' index.html
          grep -q 'Wholesale Food Trading Since 1993' index.html
          grep -q 'Our Businesses' index.html
          grep -q 'Our Branches & Locations' index.html
          grep -q 'Contact LALA STAR TRADING CO.' index.html
          python scripts/accessibility-check.py
          echo 'OK: image, accessibility, and bilingual validation passed.'
      - name: Commit generated assets and index wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images index.html assets/optimized/food-products-1600.webp assets/optimized/plastic-products-1600.webp assets/optimized/sweets-snacks-1600.webp
          if git diff --cached --quiet; then echo 'No generated changes to commit.'; exit 0; fi
          git commit -m 'fix(images): update generated assets and bilingual page [skip ci]'
      - name: Rebase and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
