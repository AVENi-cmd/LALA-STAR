name: Fix Footer Registration Rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-footer-registration-render.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Isolate footer verification from i18n rewriting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = '<div class="verification"><strong>السجل التجاري:</strong> <bdi class="footer-number">2252101993</bdi> · <strong>الرقم الضريبي:</strong> <bdi class="footer-number">310275588900003</bdi> · <strong>موثق لدى منصة الأعمال</strong></div>'
          new = '<div class="verification" data-i18n-footer="1" translate="no"><strong data-footer-ar="السجل التجاري:" data-footer-en="CR:">السجل التجاري:</strong> <bdi class="footer-number" dir="ltr" translate="no">2252101993</bdi> · <strong data-footer-ar="الرقم الضريبي:" data-footer-en="VAT:">الرقم الضريبي:</strong> <bdi class="footer-number" dir="ltr" translate="no">310275588900003</bdi> · <strong data-footer-ar="موثق لدى منصة الأعمال" data-footer-en="Verified on Saudi Business Platform">موثق لدى منصة الأعمال</strong></div>'
          if old not in s:
              raise SystemExit('Expected current footer verification markup not found')
          index.write_text(s.replace(old, new, 1), encoding='utf-8')

          js = Path('assets/i18n.js')
          s = js.read_text(encoding='utf-8')
          old_fn = "  const translateNode=(node,lang)=>{"
          new_fn = '''  const footerVerification=(lang)=>{\n    const footer=document.querySelector('.verification[data-i18n-footer="1"]');\n    if(!footer)return;\n    footer.querySelectorAll('[data-footer-ar][data-footer-en]').forEach(el=>{\n      el.textContent=lang==='en'?el.getAttribute('data-footer-en'):el.getAttribute('data-footer-ar');\n    });\n    const numbers=footer.querySelectorAll('.footer-number');\n    ['2252101993','310275588900003'].forEach((value,i)=>{if(numbers[i])numbers[i].textContent=value;});\n  };\n  const translateNode=(node,lang)=>{'''
          if old_fn not in s:
              raise SystemExit('Expected i18n translateNode marker not found')
          s = s.replace(old_fn, new_fn, 1)

          old_selectors = "      if(el.closest('script,style,noscript'))return;"
          new_selectors = "      if(el.closest('script,style,noscript,.verification[data-i18n-footer=\"1\"]'))return;"
          if old_selectors not in s:
              raise SystemExit('Expected i18n selector guard not found')
          s = s.replace(old_selectors, new_selectors, 1)

          old_walker = "      if(node.parentElement?.closest('script,style,noscript'))return;"
          new_walker = "      if(node.parentElement?.closest('script,style,noscript,.verification[data-i18n-footer=\"1\"]'))return;"
          if old_walker not in s:
              raise SystemExit('Expected i18n text-node guard not found')
          s = s.replace(old_walker, new_walker, 1)

          old_after = "    document.querySelectorAll('a[href^=\"tel:\"]').forEach(a=>{if(!a.textContent.trim())return;a.setAttribute('data-ar','اتصال');a.setAttribute('data-en','Call');setText(a,lang==='en'?'Call':'اتصال');});"
          new_after = old_after + "\n    footerVerification(lang);"
          if old_after not in s:
              raise SystemExit('Expected i18n telephone mapping not found')
          s = s.replace(old_after, new_after, 1)

          js.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-footer-registration-render.yml

      - name: Commit and push final footer fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/i18n.js .github/workflows/fix-footer-registration-render.yml
          git commit -m "fix(footer): prevent registration number i18n rewrite"
          git push origin HEAD:main
