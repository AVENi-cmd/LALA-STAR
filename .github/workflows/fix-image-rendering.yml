name: Fix Image Rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-image-rendering.yml'
      - 'index.html'
      - '.github/workflows/image-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair image references and containers
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          warehouse = 'assets/optimized/wholesale-warehouse-ahsa-1920.webp?v=20260917-3'
          warehouse_small = 'assets/optimized/wholesale-warehouse-ahsa-1280.webp?v=20260917-3'
          dammam = 'assets/optimized/food-products-dammam-1280.webp?v=20260917-3'
          ahsa = 'assets/optimized/food-products-ahsa-1280.webp?v=20260917-3'

          # Use the approved warehouse image as the Hero background.
          hero_rule = '''\n    /* Approved warehouse Hero image */\n    .hero, #hero, .hero-section {\n      background-image: linear-gradient(135deg, rgba(11,21,36,.72) 0%, rgba(17,34,56,.64) 50%, rgba(8,15,26,.78) 100%), url("%s") !important;\n      background-size: cover !important;\n      background-position: center !important;\n      background-repeat: no-repeat !important;\n    }\n''' % warehouse
          html = re.sub(r'\n\s*/\* Approved warehouse Hero image \*/.*?\n\s*</style>', '', html, flags=re.S)
          html = html.replace('</style>', hero_rule + '  </style>', 1)

          # The current source contains empty image containers. Replace them with real local assets.
          html = html.replace(
              '<div class="photo"><div class="caption">تجارة وتوزيع بالجملة</div></div>',
              '<div class="photo"><img src="%s" alt="مستودع لألأة النجوم التجارية للجملة" width="1280" height="720" loading="lazy" decoding="async"><div class="caption">تجارة وتوزيع بالجملة</div></div>' % warehouse_small
          )

          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body">',
              '<article class="business"><picture><img src="%s" alt="المواد الغذائية بالجملة" width="1280" height="720" loading="lazy" decoding="async"></picture><div class="business-body">' % ahsa,
              1
          )

          # The plastic/sweets source images are not present in main, so do not fabricate them.
          # Keep their cards structurally valid and use a neutral visual treatment instead of a broken image.
          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              '<article class="business business-no-image"><div class="business-placeholder" aria-hidden="true"></div><div class="business-body"><h3>المنتجات البلاستيكية</h3>',
              1
          )
          html = html.replace(
              '<article class="business"><picture></picture><div class="business-body"><h3>الحلويات والسناكات</h3>',
              '<article class="business business-no-image"><div class="business-placeholder" aria-hidden="true"></div><div class="business-body"><h3>الحلويات والسناكات</h3>',
              1
          )

          html = html.replace(
              '<article class="branch"><div class="branch-img"></div>',
              '<article class="branch"><div class="branch-img"><img src="%s" alt="فرع المواد الغذائية في الدمام" width="1280" height="720" loading="lazy" decoding="async"></div>' % dammam,
              1
          )
          html = html.replace(
              '<article class="branch"><div class="branch-img"></div>',
              '<article class="branch"><div class="branch-img"><img src="%s" alt="فرع المواد الغذائية في الأحساء" width="1280" height="720" loading="lazy" decoding="async"></div>' % ahsa,
              1
          )

          placeholder_css = '''\n    .business-placeholder {\n      height:330px;\n      background:linear-gradient(135deg,#d8dee7 0%,#aeb7c4 52%,#7f8997 100%);\n      position:relative;\n      overflow:hidden;\n    }\n    .business-placeholder:after {\n      content:"";\n      position:absolute;\n      inset:0;\n      background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 45%,rgba(15,30,54,.16));\n    }\n    @media(max-width:850px){.business-placeholder{height:300px}}\n    @media(max-width:520px){.business-placeholder{height:260px}}\n'''
          if '.business-placeholder {' not in html:
              html = html.replace('</style>', placeholder_css + '  </style>', 1)

          # Explicitly guarantee the image sizing contract requested for the cards.
          if '.business img{width:100%;height:330px;object-fit:cover' not in html:
              html = html.replace('.business img{width:100%;height:330px;', '.business img{width:100%;height:330px;object-fit:cover;')

          index.write_text(html, encoding='utf-8')

      - name: Strengthen image validation workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/image-assets.yml')
          text = p.read_text(encoding='utf-8')
          old = "          refs = sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\\.(?:webp|jpg|jpeg|png)', html)))"
          new = "          refs = sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\\.(?:webp|jpg|jpeg|png)', html)))\n          required = [\n              'assets/optimized/wholesale-warehouse-ahsa-1920.webp',\n              'assets/optimized/wholesale-warehouse-ahsa-1280.webp',\n              'assets/optimized/food-products-ahsa-1280.webp',\n              'assets/optimized/food-products-dammam-1280.webp',\n          ]\n          for ref in required:\n              if not (root / ref).is_file():\n                  errors.append(f'Required approved image missing: {ref}')\n          for selector in ['<div class=\"photo\">', '<div class=\"branch-img\">', '<picture>']:\n              if selector in html and selector + '</div>' in html:\n                  errors.append(f'Empty image container remains near: {selector}')"
          if old in text:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

      - name: Verify approved assets and source wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/optimized/wholesale-warehouse-ahsa-1920.webp
          test -f assets/optimized/wholesale-warehouse-ahsa-1280.webp
          test -f assets/optimized/food-products-ahsa-1280.webp
          test -f assets/optimized/food-products-dammam-1280.webp
          grep -q 'wholesale-warehouse-ahsa-1920.webp' index.html
          grep -q 'food-products-ahsa-1280.webp' index.html
          grep -q 'food-products-dammam-1280.webp' index.html
          grep -q 'object-fit:cover' index.html
          grep -q 'background-image:' index.html
          echo 'Image source wiring verified.'

      - name: Remove this one-time repair workflow
        run: git rm .github/workflows/fix-image-rendering.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/image-assets.yml
          git add -u .github/workflows/fix-image-rendering.yml
          git commit -m 'fix(images): wire approved assets and validate image containers'
          git push origin main
