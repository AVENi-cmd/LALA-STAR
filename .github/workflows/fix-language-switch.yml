name: Fix language switching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-language:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix i18n switching
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('assets/i18n.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace("const current=localStorage.getItem(KEY)||defaultLang;", "let current=localStorage.getItem(KEY)||defaultLang;")

          old = "const current=localStorage.getItem(KEY)||defaultLang;"
          if old in s:
              s = s.replace(old, "let current=localStorage.getItem(KEY)||defaultLang;")

          old_translate = "function translate(){document.documentElement.lang=current;document.documentElement.dir=current==='ar'?'rtl':'ltr';document.title=meta[current].title;const desc=document.querySelector('meta[name=\"description\"]');if(desc)desc.content=meta[current].description;document.querySelectorAll('[data-ar][data-en]').forEach(el=>{el.textContent=current==='ar'?el.dataset.ar:el.dataset.en});const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const t=walker.currentNode.textContent.trim();if(dictionary[t])walker.currentNode.textContent=dictionary[t]}}"
          new_translate = r'''const reverseDictionary=Object.fromEntries(Object.entries(dictionary).map(([ar,en])=>[en,ar]));
function translate(){
  document.documentElement.lang=current;
  document.documentElement.dir=current==='ar'?'rtl':'ltr';
  document.title=meta[current].title;
  const desc=document.querySelector('meta[name="description"]');
  if(desc)desc.content=meta[current].description;
  document.querySelectorAll('[data-ar][data-en]').forEach(el=>{el.textContent=current==='ar'?el.dataset.ar:el.dataset.en});
  const map=current==='ar'?reverseDictionary:dictionary;
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const node=walker.currentNode;
    const t=node.textContent.trim();
    if(map[t])node.textContent=map[t];
  }
}'''
          if old_translate in s:
              s = s.replace(old_translate, new_translate)
          else:
              s = re.sub(r"function translate\(\)\{.*?\n\}function floating\(\)", new_translate + "\nfunction floating()", s, count=1, flags=re.S)

          marker = "function init(){translate();injectWholesale();injectContacts();floating();secure()}"
          replacement = r'''function setLanguage(lang){
  if(lang!=='ar'&&lang!=='en')return;
  current=lang;
  localStorage.setItem(KEY,current);
  translate();
  document.querySelector('[data-wholesale-injected]')?.remove();
  injectWholesale();
  injectContacts();
  floating();
  secure();
  const button=document.querySelector('.lang,[data-lang-toggle]');
  if(button)button.textContent=current==='ar'?'English':'العربية';
}
window.setLanguage=setLanguage;
window.toggleLanguage=()=>setLanguage(current==='ar'?'en':'ar');
document.addEventListener('click',e=>{
  const button=e.target.closest('.lang,[data-lang-toggle]');
  if(button){e.preventDefault();window.toggleLanguage();}
});
function init(){translate();injectWholesale();injectContacts();floating();secure();const button=document.querySelector('.lang,[data-lang-toggle]');if(button)button.textContent=current==='ar'?'English':'العربية'}'''
          if marker in s:
              s = s.replace(marker, replacement)
          else:
              raise SystemExit('init marker not found')

          p.write_text(s, encoding='utf-8')

          h = Path('index.html')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace('<html lang="en" dir="ltr">','<html lang="ar" dir="rtl">').replace('<html lang="en">','<html lang="ar" dir="rtl">')
          h.write_text(hs, encoding='utf-8')

      - name: Validate JavaScript syntax
        run: node --check assets/i18n.js

      - name: Commit source fix and remove workflow
        run: |
          rm -f .github/workflows/fix-language-switch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n.js index.html .github/workflows/fix-language-switch.yml
          git diff --cached --quiet || git commit -m "fix(i18n): restore reliable Arabic and English switching"
          git push
