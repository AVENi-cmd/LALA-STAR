name: Upgrade website images
on:
  push:
    paths:
      - 'assets/food-products.jpg'
      - 'assets/plastic-products.jpg'
      - 'assets/sweets-snacks.jpg'
      - 'assets/warehouse-hero.jpg'
      - '.github/workflows/image-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-contrib-python-headless pillow numpy
      - name: Download EDSR 4x model
        run: |
          mkdir -p .image-model
          curl -L --fail --retry 3 -o .image-model/EDSR_x4.pb https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb
      - name: Generate responsive high-quality images
        run: |
          python - <<'PY'
          import cv2, os
          from PIL import Image, ImageEnhance, ImageFilter
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('.image-model/EDSR_x4.pb')
          sr.setModel('edsr',4)
          os.makedirs('assets/optimized',exist_ok=True)
          for name in ['warehouse-hero','food-products','plastic-products','sweets-snacks']:
              src=f'assets/{name}.jpg'
              im=cv2.imread(src, cv2.IMREAD_COLOR)
              if im is None: raise SystemExit(f'Cannot read {src}')
              up=sr.upsample(im)
              pil=Image.fromarray(cv2.cvtColor(up,cv2.COLOR_BGR2RGB))
              pil=ImageEnhance.Contrast(pil).enhance(1.04)
              pil=ImageEnhance.Color(pil).enhance(1.03)
              pil=pil.filter(ImageFilter.UnsharpMask(radius=0.9, percent=65, threshold=3))
              for w in (640,1280,1600):
                  h=round(pil.height*w/pil.width)
                  out=pil.resize((w,h),Image.Resampling.LANCZOS)
                  out.save(f'assets/optimized/{name}-{w}.webp','WEBP',quality=82,method=6)
                  out.save(f'assets/optimized/{name}-{w}.jpg','JPEG',quality=86,optimize=True,progressive=True)
          PY
      - name: Update HTML image sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          remote={
            'food-products':'https://images.unsplash.com/photo-1773946836315-bd8269b62b93?auto=format&fit=crop&fm=jpg&q=88',
            'plastic-products':'https://images.unsplash.com/photo-1713900105420-67ae6dbf3595?auto=format&fit=crop&fm=jpg&q=88',
            'sweets-snacks':'https://images.unsplash.com/photo-1759167632930-298bca6b4268?auto=format&fit=crop&fm=jpg&q=88',
            'warehouse-hero':'https://images.unsplash.com/photo-1645736315000-6f788915923b?auto=format&fit=crop&fm=jpg&q=88'
          }
          for name,url in remote.items():
              s=re.sub(r'assets/optimized/'+name+r'-1600\.webp',url+'&w=2400',s)
              s=re.sub(r'assets/optimized/'+name+r'-1280\.jpg',url+'&w=2400',s)
              s=re.sub(r'assets/'+name+r'\.jpg',url+'&w=2400',s)
              s=re.sub(r'srcset="[^"]*assets/optimized/'+name+r'-640\.webp[^\"]*"',f'srcset="{url}&w=640 640w, {url}&w=1280 1280w, {url}&w=2400 2400w"',s)
          s=s.replace('object-fit:contain;background:#fff','object-fit:cover;background:#fff')
          p.write_text(s)
          PY
      - name: Remove model and commit optimized assets
        run: |
          rm -rf .image-model
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/optimized index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use high-resolution activity and warehouse photography'
          git push
